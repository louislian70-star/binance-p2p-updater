name: Actualizar Tasa Oficial BCV

on:
  # Horarios inteligentes en UTC (Venezuela = UTC-4)
  schedule:
    # Ventana tarde VET: 4PM-8PM = 20:00-23:59 UTC, cada 15 min (lun-vie)
    # Desplazada 2 min para esquivar la congestion de GitHub
    - cron: "2-59/15 20-23 * * 1-5"
    # Ventana mañana VET: 7AM-10:30AM = 11:00-14:59 UTC, cada 30 min (lun-vie)
    - cron: "2-59/30 11-14 * * 1-5"
    # Chequeo pasivo: cada 4 horas (fines de semana y noches)
    - cron: "2 */4 * * *"
    
  # Disparo manual para pruebas
  workflow_dispatch:

jobs:
  update-bcv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script BCV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python bcv_updater.py
