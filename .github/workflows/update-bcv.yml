name: Actualizar Tasa Oficial BCV

on:
  schedule:
    # Mañanas (7:30 AM - 10:30 AM VET -> 11:30 - 14:30 UTC) cada 30 min lunes a viernes
    - cron: "30 11,12,13,14 * * 1-5"
    # Tardes (4:00 PM - 7:00 PM VET -> 20:00 - 23:00 UTC) cada 20 min lunes a viernes
    - cron: "0,20,40 20,21,22,23 * * 1-5"
    # Chequeo pasivo el resto del tiempo (cada 6 horas)
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  update-bcv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar BCV Updater
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python bcv_updater.py
